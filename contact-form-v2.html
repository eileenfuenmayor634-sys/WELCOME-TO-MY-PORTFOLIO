<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Formulario Mejorado</title>
  <link rel="stylesheet" href="contact-form-v2.css">
</head>
<body>
  
  <!-- =============================================================
       CONTENEDOR PRINCIPAL DEL FORMULARIO
       ============================================================= -->
  <div class="contact-wrapper">
    <div class="contact-container">
      
      <!-- =============================================================
           PANEL IZQUIERDO - INFORMACIÓN DE CONTACTO
           (Gradiente dorado orgánico con sparkles)
           ============================================================= -->
      <div class="contact-info-panel">
        
        <!-- Título -->
        <h2 class="info-title">Let's work together</h2>
        
        <!-- Subtítulo -->
        <p class="info-subtitle">Have a project in mind? Let's create something amazing together.</p>
        
        <!-- Datos de contacto -->
        <div class="contact-details">
          
          <!-- Email con icono de sobre -->
          <div class="contact-item">
            <div class="contact-item-label">Email</div>
            <div class="contact-item-value">
              <!-- Icono SVG: Sobre (línea moderna) -->
              <svg class="icon-svg" viewBox="0 0 24 24">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="M22 6l-10 7L2 6"/>
              </svg>
              <a href="mailto:hello@portfolio.com">hello@portfolio.com</a>
            </div>
          </div>
          
          <!-- Ubicación con icono de pin y bandera -->
          <div class="contact-item">
            <div class="contact-item-label">Location</div>
            <div class="contact-item-value">
              <!-- Icono SVG: Pin de ubicación -->
              <svg class="icon-svg" viewBox="0 0 24 24">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
              
              <!-- Bandera de Australia (SVG inline) -->
              <svg class="flag-icon" viewBox="0 0 128 80" xmlns="http://www.w3.org/2000/svg">
                <rect width="128" height="80" fill="#00008B"/>
                <rect width="128" height="40" fill="#fff"/>
                <path d="M0 40L128 40" stroke="red" stroke-width="20"/>
                <path d="M64 0L64 80" stroke="red" stroke-width="20"/>
                <path d="M0 0L128 80M128 0L0 80" stroke="#00008B" stroke-width="2"/>
                <polygon points="0,0 28,0 0,28" fill="#fff"/>
                <polygon points="128,0 100,0 128,28" fill="#fff"/>
                <polygon points="0,80 28,80 0,52" fill="#fff"/>
                <polygon points="128,80 100,80 128,52" fill="#fff"/>
              </svg>
              
              Sydney, Australia
            </div>
          </div>
          
        </div>
        
      </div>
      
      
      <!-- =============================================================
           PANEL DERECHO - FORMULARIO DE CONTACTO
           (Inputs modernos con efecto arcoíris)
           ============================================================= -->
      <div class="contact-form-panel">
        <form action="#" method="POST">
          
          <!-- Campo: Nombre -->
          <div class="form-group">
            <label for="name">Name</label>
            <div class="input-wrapper">
              <input 
                type="text" 
                id="name" 
                name="name" 
                class="form-input with-icon" 
                placeholder="Your name"
                required
              >
              <!-- Icono SVG: Usuario -->
              <svg class="input-icon-left" viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
          </div>
          
          <!-- Campo: Email -->
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrapper input-wrapper-focus">
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-input with-icon" 
                placeholder="your.email@example.com"
                required
              >
              <!-- Icono SVG: Sobre -->
              <svg class="input-icon-left" viewBox="0 0 24 24">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="M22 6l-10 7L2 6"/>
              </svg>
            </div>
          </div>
          
          <!-- Campo: Mensaje (CON EFECTO ARCOÍRIS EN FOCO) -->
          <div class="form-group">
            <label for="message">Message</label>
            <div class="input-wrapper input-wrapper-focus">
              <textarea 
                id="message" 
                name="message" 
                class="form-input" 
                placeholder="Tell me about your project" 
                rows="4"
                required
              ></textarea>
              <!-- Icono SVG: Lápiz/Burbuja de edición -->
              <svg class="input-icon-left" viewBox="0 0 24 24" style="top: 18px;">
                <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
              </svg>
            </div>
          </div>
          
          <!-- Botón de envío -->
          <button type="submit" class="submit-btn">
            Send Message
          </button>
          
        </form>
      </div>
      
    </div>
  </div>
  
</body>
</html>
